<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台中市召會 統計報表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f0f4f8;color:#1a1a1a;padding:16px;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.07)}
/* 標題 */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #e8edf2}
.page-header h2{font-size:17px;font-weight:600;color:#1F4E79}
.page-header p{font-size:12px;color:#888;margin-top:2px}
/* 工具列 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.82}
.btn-import{background:#e8f0fe;color:#1a56db}
.btn-excel{background:#e6f4ea;color:#1e6b2e}
.btn-png{background:#f3e8fd;color:#6b21a8}
.btn-danger{background:#fce8e6;color:#c0392b}
.btn-import input{display:none}
/* 控制列 */
.ctrl-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ctrl-row label{font-size:12px;color:#666}
.ctrl-row input{padding:5px 10px;border:1px solid #ccc;border-radius:6px;font-size:12px;font-family:inherit;width:140px}
.hint{font-size:11px;color:#888}
/* 分隔線 */
.section-sep{border:none;border-top:2px dashed #e0e7ef;margin:20px 0}
.section-title{font-size:13px;font-weight:600;color:#1F4E79;margin-bottom:10px;display:flex;align-items:center;gap:6px}
/* 週標籤 */
.week-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.week-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:#e8f0fe;border-radius:20px;font-size:12px;color:#1a56db}
.week-tag .del{cursor:pointer;color:#b0c0d8;font-size:15px;line-height:1;margin-left:2px}
.week-tag .del:hover{color:#c0392b}
/* 摘要卡 */
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.s-card{background:#f0f4f8;border-radius:8px;padding:10px 12px}
.s-card .label{font-size:11px;color:#666;margin-bottom:4px}
.s-card .val{font-size:20px;font-weight:600;color:#1a1a1a}
.s-card .delta{font-size:11px;margin-top:2px}
.pos{color:#2e7d32}.neg{color:#c62828}.neu{color:#666}
/* 表格 */
.tbl-wrap{overflow-x:auto;border:1px solid #c5d3e0;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead tr:first-child th{background:#1F4E79;color:#fff;font-weight:600;font-size:13px;padding:10px 8px;text-align:center;white-space:nowrap;letter-spacing:.3px}
thead tr:last-child th{background:#2E75B6;color:#fff;font-weight:500;font-size:12px;padding:7px 8px;text-align:center;line-height:1.5}
tbody tr{border-bottom:1px solid #dde6ef}
tbody tr:last-child{border-bottom:none}
tbody tr.group-start td{border-top:2.5px solid #1F4E79}
tbody td{padding:7px 8px;text-align:center;font-size:14px;vertical-align:middle;font-weight:500}
.td-dist{font-weight:600;background:#eef2f7;color:#334155;font-size:13px;text-align:left;padding-left:12px;border-right:2px solid #c5d3e0}
/* 基數欄 - 藍色系 */
.td-base-life{background:#dbeafe;color:#1e40af;font-weight:600}
.td-base-row{background:#bfdbfe;color:#1e3a8a;font-weight:700;font-size:15px}
.td-base-home{background:#e0f2fe;color:#0369a1;font-weight:700;font-size:15px}
.td-base-sun{background:#bfdbfe;color:#1e3a8a;font-weight:700;font-size:15px}
/* 本週數據欄 - 依類別色 */
.td-week-row{background:#fef9c3;color:#854d0e;font-weight:600}
.td-week-home{background:#dcfce7;color:#166534;font-weight:600}
.td-week-sun{background:#ffe4e6;color:#9f1239;font-weight:600}
.td-week-life{background:#f3e8ff;color:#6b21a8;font-weight:600}
/* 小計 */
.td-week-grp-row{background:#fef08a;color:#713f12;font-weight:700;font-size:15px}
.td-week-grp-home{background:#bbf7d0;color:#14532d;font-weight:700;font-size:15px}
.td-week-grp-sun{background:#fecdd3;color:#881337;font-weight:700;font-size:15px}
.td-week-grp-life{background:#e9d5ff;color:#581c87;font-weight:700;font-size:15px}
.td-ratio{font-weight:700;font-size:14px}
.td-grp-ratio{font-weight:800;font-size:15px}
.total-row td{background:#1F4E79!important;color:#fff!important;font-weight:700;font-size:15px}
.subtotal-row td{border-top:1.5px solid #93c5fd;background:#f0f7ff}
.subtotal-row .td-dist{background:#e2ecf8;color:#1e3a8a;font-size:12px;font-weight:600}
.stripe td{background-color:rgba(0,0,0,0.012)}
/* tooltip */
tbody td[title],thead th[title]{cursor:help}
/* 摘要卡改大 */
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.s-card{border-radius:10px;padding:14px 16px;border:1.5px solid transparent}
.s-card.life{background:#f3e8ff;border-color:#c084fc}
.s-card.row{background:#fef9c3;border-color:#facc15}
.s-card.home{background:#dcfce7;border-color:#4ade80}
.s-card.sun{background:#ffe4e6;border-color:#fb7185}
.s-card .label{font-size:12px;color:#555;margin-bottom:6px;font-weight:500}
.s-card .val{font-size:26px;font-weight:700;color:#1a1a1a}
.s-card .delta{font-size:12px;margin-top:4px;font-weight:500}
/* 空白提示 */
.empty-hint{text-align:center;padding:36px 20px;color:#bbb;font-size:13px;border:2px dashed #dde3ea;border-radius:8px}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 22px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
@media(max-width:600px){
  .summary-cards{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:12px}
  body{padding:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <div>
      <h2>台中市召會 · 統計報表</h2>
      <p id="page-subtitle">基數資料已內建，請匯入 Excel 以載入數據</p>
    </div>
  </div>

  <!-- ── 週報表區 ── -->
  <div class="section-title">📋 週報表</div>
  <div class="toolbar">
    <label class="btn btn-import">
      📂 匯入 Excel
      <input type="file" accept=".xlsx,.xls,.csv" onchange="importWeekExcel(this)">
    </label>
    <button class="btn btn-excel" onclick="exportWeekExcel()">📊 匯出 Excel</button>
    <button class="btn btn-png" onclick="exportPNG('week-content','week-title')">🖼 匯出圖片</button>
    <button class="btn btn-danger" onclick="clearWeekData()">🗑 清除</button>
    <span class="hint" id="week-status"></span>
  </div>
  <div class="ctrl-row">
    <label>週次：</label>
    <input type="text" id="week-title" placeholder="例：5/11-5/17" oninput="renderWeek()">
  </div>
  <div id="week-content">
    <div class="empty-hint">📂 請匯入 Excel 以載入本週數據<br><small style="color:#ccc;margin-top:6px;display:block">基數資料已內建，匯入後自動計算繁增比例</small></div>
  </div>

  <hr class="section-sep">

  <!-- ── 月報表區 ── -->
  <div class="section-title">📅 月報表
    <span style="font-size:11px;font-weight:400;color:#888" id="month-week-count"></span>
  </div>
  <div class="toolbar">
    <label class="btn btn-import">
      📂 新增週資料
      <input type="file" accept=".xlsx,.xls,.csv" multiple onchange="importMonthExcel(this)">
    </label>
    <button class="btn btn-excel" onclick="exportMonthExcel()">📊 匯出月報 Excel</button>
    <button class="btn btn-png" onclick="exportPNG('month-content','month-title')">🖼 匯出圖片</button>
    <button class="btn btn-danger" onclick="clearMonthData()">🗑 清除</button>
  </div>
  <div class="ctrl-row">
    <label>月份：</label>
    <input type="text" id="month-title" placeholder="例：2026年5月" oninput="renderMonth()">
  </div>
  <div class="week-list" id="week-tags"></div>
  <div id="month-content">
    <div class="empty-hint">📂 請新增週資料以建立月報表<br><small style="color:#ccc;margin-top:6px;display:block">可一次選多個 Excel 檔案，動態新增週次</small></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// bl=召會生活兒童數基數, br=兒童排基數, bs=主日基數, bh=家聚會受訪基數
const BASE=[
  {g:"A",dist:"一",    bl:15,br:8, bs:13,bh:4},
  {g:"A",dist:"四",    bl:6, br:5, bs:2, bh:2},
  {g:"A",dist:"三十三",bl:6, br:4, bs:2, bh:1},
  {g:"A",dist:"二十七",bl:11,br:7, bs:9, bh:9},
  {g:"B",dist:"二",    bl:15,br:11,bs:5, bh:0},
  {g:"B",dist:"三",    bl:9, br:5, bs:5, bh:6},
  {g:"B",dist:"十一",  bl:16,br:12,bs:6, bh:3},
  {g:"B",dist:"三十九",bl:5, br:4, bs:2, bh:0},
  {g:"C",dist:"十七",  bl:5, br:1, bs:4, bh:0},
  {g:"C",dist:"二十三",bl:23,br:18,bs:18,bh:12},
  {g:"C",dist:"三十四",bl:5, br:3, bs:2, bh:1},
  {g:"C",dist:"二十四",bl:21,br:9, bs:16,bh:15},
  {g:"C",dist:"四十",  bl:6, br:4, bs:4, bh:0},
  {g:"D",dist:"七",    bl:19,br:11,bs:13,bh:7},
  {g:"D",dist:"十五",  bl:8, br:3, bs:6, bh:5},
  {g:"D",dist:"二十八",bl:13,br:4, bs:11,bh:5},
  {g:"D",dist:"二十九",bl:8, br:6, bs:6, bh:5},
  {g:"E",dist:"十八",  bl:12,br:5, bs:11,bh:1},
  {g:"E",dist:"三十二",bl:5, br:0, bs:4, bh:0},
  {g:"E",dist:"十九",  bl:0, br:0, bs:0, bh:0},
  {g:"E",dist:"三十八",bl:1, br:1, bs:0, bh:0},
  {g:"E",dist:"三十一",bl:10,br:6, bs:3, bh:4},
  {g:"F",dist:"九",    bl:9, br:5, bs:6, bh:5},
  {g:"F",dist:"二十六",bl:9, br:6, bs:8, bh:3},
  {g:"F",dist:"三十七",bl:15,br:1, bs:12,bh:6},
  {g:"F",dist:"十",    bl:4, br:2, bs:4, bh:4},
  {g:"G",dist:"二十",  bl:23,br:16,bs:18,bh:11},
  {g:"G",dist:"二十一",bl:22,br:12,bs:16,bh:20},
  {g:"G",dist:"三十六",bl:18,br:13,bs:12,bh:13},
  {g:"G",dist:"二十二",bl:8, br:4, bs:5, bh:2},
  {g:"H",dist:"五",    bl:16,br:10,bs:13,bh:7},
  {g:"H",dist:"十三",  bl:9, br:4, bs:7, bh:6},
  {g:"H",dist:"三十五",bl:8, br:4, bs:8, bh:1},
  {g:"I",dist:"八",    bl:4, br:0, bs:4, bh:1},
  {g:"I",dist:"十二",  bl:5, br:2, bs:3, bh:1},
  {g:"I",dist:"十六",  bl:5, br:1, bs:3, bh:2},
  {g:"I",dist:"二十五",bl:3, br:0, bs:3, bh:1},
  {g:"I",dist:"四十一",bl:13,br:3, bs:11,bh:10},
  {g:"J",dist:"六",    bl:19,br:10,bs:14,bh:5},
  {g:"J",dist:"十四",  bl:24,br:10,bs:12,bh:14},
  {g:"J",dist:"三十",  bl:15,br:10,bs:6, bh:13},
];

let WEEK_DATA=null;
let MONTH_WEEKS=[];

function ratio(c,b){if(!b)return null;return Math.round((c-b)/b*100);}
function ratioCls(r){if(r===null)return"neu";return r>0?"pos":r<0?"neg":"neu";}
function ratioStr(r){if(r===null)return"-";return(r>0?"+":"")+r+"%";}
function n(v){return parseInt(v)||0;}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2800);
}

// ── 解析檔案 ──────────────────────────────────────
function parseFile(file,cb){
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      let rows=[];
      const data=e.target.result;
      if(typeof data==="string"&&(data.includes("<table")||data.includes("<TABLE"))){
        const doc=new DOMParser().parseFromString(data,"text/html");
        doc.querySelectorAll("tr").forEach(tr=>{
          rows.push([...tr.querySelectorAll("td,th")].map(c=>c.textContent.trim()));
        });
      } else {
        const wb=XLSX.read(data,{type:"binary"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      }
      const map={};let matched=0;

      rows.forEach(row=>{
        if(!row||row.length<10)return;
        const c0=String(row[0]).trim().replace(/大區$/,"");
        const c1=String(row[1]||"").trim().replace(/大區$/,"");
        let distName="", base_col=0;
        if(BASE.find(b=>b.dist===c1)){distName=c1; base_col=1;} // 大區名在col1
        else if(BASE.find(b=>b.dist===c0)){distName=c0; base_col=0;} // 大區名在col0
        else return;
        const base=BASE.find(b=>b.dist===distName);
        if(!base)return;
        // 新格式（含國中欄）相對大區名欄位的偏移：
        // 兒童主日 = 主日(學齡前+國小+國中) + 兒童主日(學齡前+國小)
        // 家聚會受訪 = 家聚會(學齡前+國小+國中)
        // 兒童排 = 兒童排(學齡前+國小+國中)
        // 召會生活 = 召會生活(學齡前+國小+國中)
        const b=base_col;
        map[base.dist]={
          sunday: n(row[b+1]) + n(row[b+2]) + n(row[b+3]) + n(row[b+5]) + n(row[b+6]),
          home:   n(row[b+8]) + n(row[b+9]) + n(row[b+10]),
          row:    n(row[b+12])+ n(row[b+13])+ n(row[b+14]),
          life:   n(row[b+16])+ n(row[b+17])+ n(row[b+18]),
        };
        matched++;
      });
      cb(matched>0?map:null,matched,file.name);
    }catch(err){cb(null,0,file.name,err);}
  };
  file.name.endsWith(".xls")?reader.readAsText(file,"utf-8"):reader.readAsBinaryString(file);
}

// ── 建表格 HTML ───────────────────────────────────
// 欄位順序：大區 | 召會生活基數 | 兒童排基數 | 家聚會基數 | 主日基數 || 兒童排 | 家聚會受訪 | 兒童主日 | 繁增比例
function buildTableHTML(data,weekLabel){
  const gKeys=[...new Set(BASE.map(d=>d.g))];
  let rows="",idx=0;
  gKeys.forEach(g=>{
    const gr=BASE.filter(d=>d.g===g);
    const gBL=gr.reduce((s,d)=>s+d.bl,0);
    const gBS=gr[0].bs;
    const gBH=gr[0].bh;
    const gBR=gr[0].br;
    const gL=gr.reduce((s,d)=>s+(data?n(data[d.dist]?.life):0),0);
    const gR=gr.reduce((s,d)=>s+(data?n(data[d.dist]?.row):0),0);
    const gH=gr.reduce((s,d)=>s+(data?n(data[d.dist]?.home):0),0);
    const gS=gr.reduce((s,d)=>s+(data?n(data[d.dist]?.sunday):0),0);
    const gRatio=data?ratio(gL,gBL):null;
    gr.forEach((d,di)=>{
      const w=data?data[d.dist]:null;
      const r=w?ratio(w.life,d.bl):null;
      const stripe=idx%2===1?" stripe":"";
      const v=x=>data?(x??0):"-";
      rows+=`<tr class="${di===0?"group-start":""}${stripe}">
        <td class="td-dist">${d.dist}大區</td>
        <td class="td-base-life" title="召會生活兒童數基數：${d.bl}">${d.bl}</td>
        <td class="td-base-row" title="兒童排基數：${d.br}">${d.br}</td>
        <td class="td-base-home" title="家聚會基數：${d.bh}">${d.bh}</td>
        <td class="td-base-sun" title="主日基數：${d.bs}">${d.bs}</td>
        <td class="td-week-row" title="兒童排">${v(w?.row)}</td>
        <td class="td-week-home" title="家聚會受訪（基數 ${d.bh}）">${v(w?.home)}</td>
        <td class="td-week-sun" title="兒童主日（基數 ${d.bs}）">${v(w?.sunday)}</td>
        <td class="td-week-life" title="召會生活兒童數（基數 ${d.bl}）">${v(w?.life)}</td>
        <td class="td-ratio ${ratioCls(r)}" title="${r!==null?`召會生活：本週 ${w?.life} ÷ 基數 ${d.bl} = ${ratioStr(r)}`:""}">${data?ratioStr(r):"-"}</td>
      </tr>`;
      idx++;
    });
    const gBRsum=gr.reduce((s,d)=>s+d.br,0);
    const gBHsum=gr.reduce((s,d)=>s+d.bh,0);
    const gBSsum=gr.reduce((s,d)=>s+d.bs,0);
    rows+=`<tr class="subtotal-row">
      <td class="td-dist" style="font-size:12px;text-align:right;padding-right:10px">小計 ${gBL}</td>
      <td class="td-base-life" title="召會生活兒童數基數小計">${gBL}</td>
      <td class="td-base-row" title="兒童排基數小計">${gBRsum}</td>
      <td class="td-base-home" title="家聚會基數小計">${gBHsum}</td>
      <td class="td-base-sun" title="主日基數小計">${gBSsum}</td>
      <td class="td-week-grp-row" title="兒童排小計">${data?gR:"-"}</td>
      <td class="td-week-grp-home" title="家聚會受訪小計">${data?gH:"-"}</td>
      <td class="td-week-grp-sun" title="兒童主日小計">${data?gS:"-"}</td>
      <td class="td-week-grp-life" title="召會生活兒童數小計">${data?gL:"-"}</td>
      <td class="td-grp-ratio ${ratioCls(gRatio)}" title="組繁增比例">${data?ratioStr(gRatio):"-"}</td>
    </tr>`;
  });
  const tB=BASE.reduce((s,d)=>s+d.bl,0);
  const tL=data?BASE.reduce((s,d)=>s+n(data[d.dist]?.life),0):"-";
  const tR=data?BASE.reduce((s,d)=>s+n(data[d.dist]?.row),0):"-";
  const tH=data?BASE.reduce((s,d)=>s+n(data[d.dist]?.home),0):"-";
  const tS=data?BASE.reduce((s,d)=>s+n(data[d.dist]?.sunday),0):"-";
  const tBR=BASE.reduce((s,d)=>s+d.br,0);
  const tBS=BASE.reduce((s,d)=>s+d.bs,0);
  const tBH=BASE.reduce((s,d)=>s+d.bh,0);
  rows+=`<tr class="total-row group-start">
    <td>總計</td>
    <td title="召會生活兒童數基數">${tB}</td>
    <td title="兒童排基數">${tBR}</td>
    <td title="家聚會基數">${tBH}</td>
    <td title="主日基數">${tBS}</td>
    <td title="兒童排">${tR}</td>
    <td title="家聚會受訪">${tH}</td>
    <td title="兒童主日">${tS}</td>
    <td title="召會生活兒童數">${tL}</td>
    <td title="總體繁增比例">${data?ratioStr(ratio(tL,tB)):"-"}</td>
  </tr>`;
  return`<div class="tbl-wrap"><table>
    <thead>
      <tr>
        <th rowspan="2" style="width:66px">大區</th>
        <th colspan="4" style="background:#154C79">2026 基數</th>
        <th colspan="4">${weekLabel||"本週"}</th>
        <th rowspan="2" style="width:58px">繁增<br>比例</th>
      </tr>
      <tr>
        <th style="width:54px">召會生活<br>兒童數</th>
        <th style="width:50px">兒童排<br>基數</th>
        <th style="width:50px">家聚會<br>基數</th>
        <th style="width:50px">主日<br>基數</th>
        <th style="width:50px">兒童排</th>
        <th style="width:50px">家聚會<br>受訪</th>
        <th style="width:50px">兒童主日</th>
        <th style="width:54px">召會生活<br>兒童數</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function buildSummaryHTML(data){
  const tB=BASE.reduce((s,d)=>s+d.bl,0);
  const tL=data?BASE.reduce((s,d)=>s+n(data[d.dist]?.life),0):0;
  const tR=data?BASE.reduce((s,d)=>s+n(data[d.dist]?.row),0):0;
  const tH=data?BASE.reduce((s,d)=>s+n(data[d.dist]?.home),0):0;
  const tS=data?BASE.reduce((s,d)=>s+n(data[d.dist]?.sunday),0):0;
  const r=data?ratio(tL,tB):null;
  return`<div class="summary-cards">${[
    {label:"召會生活兒童數",val:data?tL:"-",delta:data?ratioStr(r)+" vs 基數 "+tB:"",cls:ratioCls(r),card:"life"},
    {label:"兒童排",val:data?tR:"-",delta:"",cls:"neu",card:"row"},
    {label:"家聚會受訪",val:data?tH:"-",delta:"",cls:"neu",card:"home"},
    {label:"兒童主日",val:data?tS:"-",delta:"",cls:"neu",card:"sun"},
  ].map(c=>`<div class="s-card ${c.card}"><div class="label">${c.label}</div><div class="val">${c.val}</div><div class="delta ${c.cls}">${c.delta}</div></div>`).join("")}</div>`;
}

// ── 週報表 ────────────────────────────────────────
function importWeekExcel(input){
  const file=input.files[0];if(!file)return;
  parseFile(file,(map,cnt,fname,err)=>{
    if(!map){showToast(err?"匯入失敗："+err.message:"⚠️ 找不到對應大區");return;}
    WEEK_DATA=map;
    const label=fname.replace(/\.xls.*/,"").replace(/_/g," ").trim();
    if(!document.getElementById("week-title").value)
      document.getElementById("week-title").value=label;
    document.getElementById("week-status").textContent="✅ 已匯入 "+cnt+" 個大區";
    renderWeek();
    showToast("✅ 成功匯入 "+cnt+" 個大區！");
  });
  input.value="";
}

function renderWeek(){
  const label=document.getElementById("week-title").value||"本週";
  const area=document.getElementById("week-content");
  if(!WEEK_DATA){
    area.innerHTML=`<div class="empty-hint">📂 請匯入 Excel 以載入本週數據<br><small style="color:#ccc;margin-top:6px;display:block">基數資料已內建，匯入後自動計算繁增比例</small></div>`;
    return;
  }
  area.innerHTML=buildSummaryHTML(WEEK_DATA)+buildTableHTML(WEEK_DATA,label);
}

function clearWeekData(){
  if(!WEEK_DATA)return;
  WEEK_DATA=null;
  document.getElementById("week-title").value="";
  document.getElementById("week-status").textContent="";
  renderWeek();
  showToast("已清除週報表資料");
}

function exportWeekExcel(){
  if(!WEEK_DATA){showToast("請先匯入數據");return;}
  const label=document.getElementById("week-title").value||"本週";
  exportToXLSX([{label,data:WEEK_DATA}],"台中召會週報_"+label+".xlsx");
  showToast("✅ Excel 已下載！");
}

// ── 月報表 ────────────────────────────────────────
function importMonthExcel(input){
  const files=[...input.files];let done=0;
  files.forEach(file=>{
    parseFile(file,(map,cnt,fname,err)=>{
      done++;
      if(!map){showToast("⚠️ "+fname+" 找不到對應資料");return;}
      const label=fname.replace(/\.xls.*/,"").replace(/_/g," ").trim();
      if(MONTH_WEEKS.find(w=>w.label===label)){
        showToast("⚠️ 「"+label+"」已存在，略過");
      } else {
        MONTH_WEEKS.push({label,data:map});
      }
      if(done===files.length){
        renderMonthTags();
        renderMonth();
        showToast("✅ 已載入共 "+MONTH_WEEKS.length+" 週資料");
      }
    });
  });
  input.value="";
}

function renderMonthTags(){
  const tags=document.getElementById("week-tags");
  const cnt=document.getElementById("month-week-count");
  cnt.textContent=MONTH_WEEKS.length?"（共 "+MONTH_WEEKS.length+" 週）":"";
  tags.innerHTML=MONTH_WEEKS.map((w,i)=>`
    <span class="week-tag">${w.label}
      <span class="del" onclick="removeWeek(${i})" title="移除">×</span>
    </span>`).join("");
}

function removeWeek(i){
  MONTH_WEEKS.splice(i,1);
  renderMonthTags();renderMonth();
  showToast("已移除該週資料");
}

function clearMonthData(){
  if(!MONTH_WEEKS.length)return;
  MONTH_WEEKS=[];
  renderMonthTags();renderMonth();
  showToast("已清除所有週資料");
}

function trimmedMean(vals){
  // 3筆以上：去最高1、最低1後取平均；否則直接平均
  if(vals.length>=3){
    const sorted=[...vals].sort((a,b)=>a-b);
    const trimmed=sorted.slice(1,sorted.length-1);
    return trimmed.reduce((s,v)=>s+v,0)/trimmed.length;
  }
  return vals.reduce((s,v)=>s+v,0)/vals.length;
}

function getAvgData(){
  if(!MONTH_WEEKS.length)return null;

  // 每週各欄的「全體大區總數」
  const fields=["row","home","sunday","life"];
  const weekTotals={};
  fields.forEach(f=>{
    weekTotals[f]=MONTH_WEEKS.map(w=>BASE.reduce((s,b)=>s+n(w.data[b.dist]?.[f]),0));
  });

  // 對各欄週總數做去極值平均，得到該欄的月平均總數
  const fieldAvg={};
  fields.forEach(f=>{
    fieldAvg[f]=trimmedMean(weekTotals[f]);
  });

  // 按各大區佔比分配（保留整數，誤差補在最大佔比大區）
  const avg={};
  fields.forEach(f=>{
    const total=Math.round(fieldAvg[f]);
    const rawTotal=BASE.reduce((s,b)=>s+MONTH_WEEKS.reduce((ss,w)=>ss+n(w.data[b.dist]?.[f]),0),0);
    let distributed=0;
    let maxDist=null, maxVal=-1;
    BASE.forEach(b=>{
      const distTotal=MONTH_WEEKS.reduce((s,w)=>s+n(w.data[b.dist]?.[f]),0);
      const val=rawTotal>0?Math.round(distTotal/rawTotal*total):0;
      if(!avg[b.dist])avg[b.dist]={};
      avg[b.dist][f]=val;
      distributed+=val;
      if(distTotal>maxVal){maxVal=distTotal;maxDist=b.dist;}
    });
    // 補差值到最大佔比大區
    if(maxDist)avg[maxDist][f]+=(total-distributed);
  });
  return avg;
}

function renderMonth(){
  const area=document.getElementById("month-content");
  if(!MONTH_WEEKS.length){
    area.innerHTML=`<div class="empty-hint">📂 請新增週資料以建立月報表<br><small style="color:#ccc;margin-top:6px;display:block">可一次選多個 Excel 檔案，動態新增週次</small></div>`;
    return;
  }
  const cnt=MONTH_WEEKS.length;
  const avg=getAvgData();
  const label=cnt>=3?cnt+"週平均（扣最高最低）":cnt+"週平均";
  area.innerHTML=buildSummaryHTML(avg)+buildTableHTML(avg,label);
}

// ── 匯出 Excel ────────────────────────────────────
function exportToXLSX(sheets,filename){
  const wb=XLSX.utils.book_new();
  sheets.forEach(({label,data})=>{
    const gKeys=[...new Set(BASE.map(d=>d.g))];
    const aoa=[["大區","召會生活兒童數(基數)","兒童排基數","主日基數","兒童排","家聚會受訪","兒童主日","召會生活兒童數","繁增比例"]];
    gKeys.forEach(g=>{
      const gr=BASE.filter(d=>d.g===g);
      const gBL=gr.reduce((s,d)=>s+d.bl,0);
      const gL=gr.reduce((s,d)=>s+n(data[d.dist]?.life),0);
      gr.forEach(d=>{
        aoa.push([d.dist+"大區",d.bl,d.br,d.bs,
          n(data[d.dist]?.row),n(data[d.dist]?.home),n(data[d.dist]?.sunday),n(data[d.dist]?.life),
          ratioStr(ratio(n(data[d.dist]?.life),d.bl))]);
      });
      aoa.push(["小計 "+gBL,gBL,gr[0].br,gr.reduce((s,d)=>s+d.bs,0),
        gr.reduce((s,d)=>s+n(data[d.dist]?.row),0),
        gr.reduce((s,d)=>s+n(data[d.dist]?.home),0),
        gr.reduce((s,d)=>s+n(data[d.dist]?.sunday),0),
        gL,ratioStr(ratio(gL,gBL))]);
    });
    const tB=BASE.reduce((s,d)=>s+d.bl,0);
    const tL=BASE.reduce((s,d)=>s+n(data[d.dist]?.life),0);
    aoa.push(["總計",tB,gKeys.reduce((s,g)=>s+BASE.find(d=>d.g===g).br,0),
      BASE.reduce((s,d)=>s+d.bs,0),
      BASE.reduce((s,d)=>s+n(data[d.dist]?.row),0),
      BASE.reduce((s,d)=>s+n(data[d.dist]?.home),0),
      BASE.reduce((s,d)=>s+n(data[d.dist]?.sunday),0),
      tL,ratioStr(ratio(tL,tB))]);
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"]=[{wch:13},{wch:16},{wch:10},{wch:10},{wch:8},{wch:10},{wch:10},{wch:14},{wch:10}];
    XLSX.utils.book_append_sheet(wb,ws,(label||"報表").replace(/[:\\\/\?\*\[\]]/g,"").substring(0,31));
  });
  XLSX.writeFile(wb,filename);
}

function exportMonthExcel(){
  if(!MONTH_WEEKS.length){showToast("請先新增週資料");return;}
  const mTitle=document.getElementById("month-title").value||"月報表";
  const cnt=MONTH_WEEKS.length;
  const avgLabel=cnt>=3?"週平均（共"+cnt+"週，扣最高最低）":"週平均（共"+cnt+"週）";
  const avg=getAvgData();
  const wb=XLSX.utils.book_new();

  // 月報表：只列大區名稱 + 四個欄位週平均
  const aoa=[
    [mTitle],
    [avgLabel],
    [],
    ["大區","兒童排","家聚會受訪","兒童主日","召會生活兒童數"],
  ];
  const gKeys=[...new Set(BASE.map(d=>d.g))];
  gKeys.forEach(g=>{
    const gr=BASE.filter(d=>d.g===g);
    gr.forEach(d=>{
      aoa.push([
        d.dist+"大區",
        n(avg[d.dist]?.row),
        n(avg[d.dist]?.home),
        n(avg[d.dist]?.sunday),
        n(avg[d.dist]?.life),
      ]);
    });
    // 組小計
    aoa.push([
      "　小計",
      gr.reduce((s,d)=>s+n(avg[d.dist]?.row),0),
      gr.reduce((s,d)=>s+n(avg[d.dist]?.home),0),
      gr.reduce((s,d)=>s+n(avg[d.dist]?.sunday),0),
      gr.reduce((s,d)=>s+n(avg[d.dist]?.life),0),
    ]);
  });
  // 總計
  aoa.push([
    "總計",
    BASE.reduce((s,d)=>s+n(avg[d.dist]?.row),0),
    BASE.reduce((s,d)=>s+n(avg[d.dist]?.home),0),
    BASE.reduce((s,d)=>s+n(avg[d.dist]?.sunday),0),
    BASE.reduce((s,d)=>s+n(avg[d.dist]?.life),0),
  ]);

  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:14},{wch:10},{wch:12},{wch:10},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws,"月報表");
  XLSX.writeFile(wb,"台中召會月報_"+mTitle+".xlsx");
  showToast("✅ 月報 Excel 已下載！");
}
